name: Deploy dev-chemos to EC2

on:
  push:
    branches: [dev-chemos]
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

# never run two deploys at the same time; a newer push cancels the older one
concurrency:
  group: deploy-dev-chemos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e

            # non-interactive SSH does not load your shell profile; load nvm if node was installed with it
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd "${{ secrets.EC2_APP_DIR }}"

            echo "==> Pulling latest dev-chemos"
            git fetch origin dev-chemos
            git checkout dev-chemos
            git reset --hard origin/dev-chemos

            echo "==> Installing dependencies"
            # fall back to npm install if the lock file was generated by a different npm version
            npm ci || { echo "npm ci failed, falling back to npm install"; npm install; }

            echo "==> Building"
            npm run build

            echo "==> Reloading pm2"
            pm2 reload "${{ secrets.PM2_APP_NAME }}" --update-env \
              || pm2 start npm --name "${{ secrets.PM2_APP_NAME }}" -- start -- -p 3001
            pm2 save

            # discard any lock file changes npm install made, so the next git pull stays clean
            git checkout -- package-lock.json

            echo "==> Deployed commit $(git rev-parse --short HEAD)"
